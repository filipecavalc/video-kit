<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reports</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0f1419; color: #e6edf3; }
  header { display: flex; align-items: center; gap: 16px; padding: 22px 40px; border-bottom: 1px solid #263040; }
  header b { font-size: 22px; } header span { color: #7d8590; }
  main { padding: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .card { background: #161b22; border: 1px solid #263040; border-radius: 14px; padding: 28px; }
  h2 { margin: 0 0 18px; font-size: 20px; color: #7d8590; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; font-size: 20px; padding: 14px; border-radius: 10px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; }
  button { margin-top: 18px; font-size: 20px; padding: 14px 26px; border-radius: 10px; border: 0; background: #3ddc97; color: #0b1a12; font-weight: 700; cursor: pointer; }
  #status { margin-top: 18px; font-size: 18px; color: #7d8590; min-height: 26px; }
  .bars { display: flex; align-items: flex-end; gap: 14px; height: 220px; }
  .bars div { flex: 1; background: #3ddc97; border-radius: 6px 6px 0 0; transition: height .6s ease; height: 8%; }
</style>
</head>
<body>
<header><b>Nightly reports</b><span>demo app for video-kit capture</span></header>
<main>
  <section class="card">
    <h2>Run a report</h2>
    <input id="url" placeholder="https://api.example.com/report">
    <button id="run">Run report</button>
    <div id="status"></div>
  </section>
  <section class="card">
    <h2>Last 7 runs</h2>
    <div class="bars" id="bars"><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
  </section>
</main>
<script>
  document.getElementById("run").onclick = () => {
    const s = document.getElementById("status");
    s.textContent = "Running…";
    setTimeout(() => {
      s.textContent = "✓ Report ready in 1.8 s (3 retries avoided)";
      [40, 62, 55, 80, 71, 90, 96].forEach((h, i) => (document.querySelectorAll("#bars div")[i].style.height = h + "%"));
    }, 900);
  };
</script>
</body>
</html>
